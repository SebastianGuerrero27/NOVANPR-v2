# Configuración de AlertManager para el Sistema ANPR
# ECU 911 Zona 3 - Ambato

global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:25'  # Configurar si se usa SMTP
  smtp_from: 'alertmanager@ecu911.gob.ec'

# No hay destinatarios configurados por defecto
# Los destinatarios se configuran en routes o receivers específicos
receivers:
  - name: 'null'
    # Configuración vacía para evitar envíos no deseados durante desarrollo
    # En producción, configurar email, Slack, u otros canales aquí

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'null'
  routes:
    # Ejemplo: alertas críticas podrían ir a un receptor diferente
    # - match:
    #     severity: critical
    #   receiver: 'critical-alerts'
