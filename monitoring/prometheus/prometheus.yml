# Configuración de Prometheus para el Sistema ANPR
# ECU 911 Zona 3 - Ambato

global:
  scrape_interval: 15s # Intervalo de recolección de métricas
  evaluation_interval: 15s # Intervalo de evaluación de reglas
  external_labels:
    cluster: 'anpr-ecu911'
    environment: 'production'

# Configuración de alertas
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Reglas de alerta
rule_files:
  - 'rules/*.yml'

# Configuración de scrape para recolectar métricas
scrape_configs:
  # Métricas del Backend Node.js
  - job_name: 'anpr-backend'
    static_configs:
      - targets: ['backend:5000']
        labels:
          service: 'backend'
          component: 'api'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Métricas del Microservicio ANPR Python
  - job_name: 'anpr-service'
    static_configs:
      - targets: ['anpr:8000']
        labels:
          service: 'anpr'
          component: 'ml-inference'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Métricas de PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
        labels:
          service: 'database'
          component: 'postgresql'
    scrape_interval: 15s
