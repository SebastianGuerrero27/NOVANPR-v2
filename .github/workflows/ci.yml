name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Type check
        working-directory: ./backend
        run: npm run typecheck

      - name: Run tests
        working-directory: ./backend
        run: npm test

      - name: Generate coverage
        working-directory: ./backend
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  test-anpr-service:
    name: Test ANPR Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Misma versión que la imagen (python:3.12.15-slim-trixie)
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/anpr/requirements.txt

      - name: Install dependencies
        working-directory: ./services/anpr
        run: |
          python -m pip install --upgrade pip
          # Versiones exactas de la imagen (PyTorch solo CPU; el índice va dentro del archivo)
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: ./services/anpr
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./services/anpr/coverage.xml
          flags: anpr-service
          name: anpr-service-coverage

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # ESLint (TypeScript + hooks de React) sin advertencias; el build incluye la verificación de capas y tsc
      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      # Vitest: alineación del HUD, formulario de cámaras, estados de la página y guardas (sin
      # webcam ni RTSP fijo)
      - name: Run tests
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: frontend/dist/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # upload-sarif necesita escribir alertas de code scanning y leer el run (si faltan: "Resource not
    # accessible by integration")
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      # Umbral del job: falla ante vulnerabilidades CRÍTICAS que tengan versión corregida
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # Code scanning en repositorios privados requiere GitHub Advanced Security: ahí el informe
      # se conserva como artefacto del workflow
      - name: Upload Trivy results to GitHub Security
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy report (artifact)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.sarif

  docker-build:
    name: Build Docker Images (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [test-backend, test-anpr-service, test-frontend]
    # Construye las mismas imágenes de producción que publica el CD (sin publicarlas): un Dockerfile
    # roto se detecta en el PR y la caché (mismo scope) la reutiliza el CD al publicar en GHCR.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: anpr-backend
            context: .
            file: backend/Dockerfile.prod
          - name: anpr-service
            context: services/anpr
            file: services/anpr/Dockerfile
          - name: anpr-frontend
            context: frontend
            file: frontend/Dockerfile.prod

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La imagen del motor ANPR incluye torch y librerías CUDA (varios GB): se libera espacio del runner
      - name: Free disk space
        if: matrix.name == 'anpr-service'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true
